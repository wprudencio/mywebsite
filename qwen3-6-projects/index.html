<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen3 Projects</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .subtitle {
            color: #888;
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        .project-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 500px;
            padding: 0 1rem;
        }

        .project-card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
        }

        .project-card:hover {
            transform: translateY(-2px);
            border-color: #4a9eff;
            background: #222;
        }

        .project-card h2 {
            font-size: 1.25rem;
            color: #4a9eff;
            margin-bottom: 0.25rem;
        }

        .project-card p {
            font-size: 0.9rem;
            color: #888;
        }

        .arrow {
            float: right;
            color: #4a9eff;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .project-card:hover .arrow {
            transform: translateX(4px);
        }
    </style>
</head>
<body>
    <h1>🚀 Qwen3 Projects</h1>
    <p class="subtitle">Select a project to explore</p>

    <div class="project-list">
        <a href="chord-generator/index.html" class="project-card">
            <h2>Chord Generator</h2>
            <p>Interactive musical chord generator</p>
            <span class="arrow">→</span>
        </a>

        <a href="dashboard/index.html" class="project-card">
            <h2>Dashboard</h2>
            <p>Data dashboard</p>
            <span class="arrow">→</span>
        </a>

        <a href="pizza-site/index.html" class="project-card">
            <h2>Pizza Site</h2>
            <p>Pizza website</p>
            <span class="arrow">→</span>
        </a>
    </div>
</body>
</html>
