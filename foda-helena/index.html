<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d0f13" />
<title>Piano · 3 Oitavas</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    height:100dvh;
    display:flex; flex-direction:column;
    padding: max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),12px) max(env(safe-area-inset-bottom),14px) max(env(safe-area-inset-left),12px);
    background: radial-gradient(120% 100% at 50% 0%, #171b22 0%, #0d0f13 70%);
    color:#e8ecf1;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:none; overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:0 4px 10px;
  }
  h1{
    margin:0; font-size:clamp(13px,3.4vw,18px); font-weight:800;
    letter-spacing:.08em; text-transform:uppercase; color:#9aa4b2;
  }
  #status{
    font-size:clamp(11px,3vw,14px); font-weight:600; color:#6d7686;
    font-variant-numeric:tabular-nums;
  }
  .grid{
    flex:1; min-height:0; display:grid; gap:clamp(6px,1.6vw,14px);
    grid-auto-flow:column;
    grid-template-rows:repeat(7,1fr);
    grid-template-columns:repeat(3,1fr);
  }
  @media (orientation:landscape), (min-width:760px){
    .grid{
      grid-auto-flow:row;
      grid-template-columns:repeat(7,1fr);
      grid-template-rows:repeat(3,1fr);
    }
  }
  .key{
    --bg1:#252b35; --bg2:#181c23; --sh:#0a0c10; --fg:#e6ebf2; --oct:#7b8494;
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15em;
    border:0; border-radius:clamp(10px,2.2vw,18px);
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--fg);
    font:inherit; font-weight:800; font-size:clamp(16px,4.6vw,28px); letter-spacing:.05em;
    box-shadow:0 4px 0 var(--sh), 0 8px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
    transition:transform .05s, box-shadow .05s, color .05s;
    touch-action:none; cursor:pointer;
  }
  .key[data-oct="3"]{ --bg1:#20252e; --bg2:#151920; }
  .key[data-oct="5"]{ --bg1:#2b3240; --bg2:#1c212b; }
  .key .oct{
    font-size:clamp(9px,2.4vw,12px); font-weight:700;
    color:var(--oct); letter-spacing:.14em;
  }
  .key.on{
    --bg1:#5b95ff; --bg2:#2e6ade; --sh:#123067; --fg:#fff; --oct:rgba(255,255,255,.72);
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--sh), 0 2px 14px rgba(91,149,255,.5), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .key:focus-visible{ outline:2px solid #5b95ff; outline-offset:3px; }
</style>
</head>
<body>
<header>
  <h1>Piano · 3 Oitavas</h1>
  <span id="status">toque para tocar</span>
</header>
<main class="grid" id="grid" aria-label="Teclado de três oitavas"></main>

<script>
  const NOTES = [['DO', 0], ['RÉ', 2], ['MI', 4], ['FÁ', 5], ['SOL', 7], ['LÁ', 9], ['SI', 11]];
  const OCTAVES = [3, 4, 5];
  const grid = document.getElementById('grid');
  const statusEl = document.getElementById('status');

  const freq = midi => 440 * Math.pow(2, (midi - 69) / 12);

  for (const oct of OCTAVES) {
    NOTES.forEach(([name, semitone]) => {
      const midi = 12 * (oct + 1) + semitone;
      const key = document.createElement('button');
      key.type = 'button';
      key.className = 'key';
      key.dataset.midi = midi;
      key.dataset.name = name;
      key.dataset.oct = oct;
      key.setAttribute('aria-label', name + ' ' + oct);
      const label = document.createElement('span');
      label.textContent = name;
      const sub = document.createElement('span');
      sub.className = 'oct';
      sub.textContent = oct;
      key.append(label, sub);
      grid.appendChild(key);
    });
  }

  const SAMPLE_REF = 246.94;

  let ctx = null;
  let master = null;
  let buffer = null;
  let decodePromise = null;
  let wavBytes = null;

  function initAudio() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      ctx = new AudioCtx();
      master = ctx.createGain();
      master.gain.value = 0.9;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.knee.value = 20;
      comp.ratio.value = 6;
      comp.attack.value = 0.004;
      comp.release.value = 0.25;
      master.connect(comp).connect(ctx.destination);

      const b64 = document.getElementById('foda').textContent.replace(/\s+/g, '');
      const bin = atob(b64);
      wavBytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) wavBytes[i] = bin.charCodeAt(i);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function noteOn(midi) {
    initAudio();
    const rate = freq(midi) / SAMPLE_REF;
    if (buffer) { playSample(rate); return; }
    if (!decodePromise) decodePromise = ctx.decodeAudioData(wavBytes.buffer).then(decoded => { buffer = decoded; });
    decodePromise.then(() => playSample(rate));
  }

  function playSample(rate) {
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = rate;
    const gain = ctx.createGain();
    gain.gain.value = 0.75;
    src.connect(gain).connect(master);
    src.start();
  }

  const active = new Map();

  function startNote(pointerId, key) {
    const midi = Number(key.dataset.midi);
    noteOn(midi);
    active.set(pointerId, { key });
    key.classList.add('on');
    statusEl.textContent = key.dataset.name + key.dataset.oct + ' · ' + freq(midi).toFixed(1) + ' Hz';
  }

  function stopNote(pointerId) {
    const entry = active.get(pointerId);
    if (!entry) return;
    active.delete(pointerId);
    entry.key.classList.remove('on');
    if (!active.size) statusEl.textContent = 'toque para tocar';
  }

  function stopAll() {
    [...active.keys()].forEach(id => stopNote(id));
  }

  function keyAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('.key') : null;
  }

  grid.addEventListener('pointerdown', e => {
    if (active.has(e.pointerId)) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const key = e.target.closest('.key');
    if (!key) return;
    e.preventDefault();
    startNote(e.pointerId, key);
  });

  window.addEventListener('pointermove', e => {
    const entry = active.get(e.pointerId);
    if (!entry) return;
    const key = keyAt(e.clientX, e.clientY);
    if (!key || key === entry.key) return;
    stopNote(e.pointerId);
    startNote(e.pointerId, key);
  });

  window.addEventListener('pointerup', e => stopNote(e.pointerId));
  window.addEventListener('pointercancel', e => stopNote(e.pointerId));
  window.addEventListener('blur', stopAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
</script>
